# docker compose up  →  PostgreSQL, migrations, seed data and the app on http://localhost:8080
# Works with no .env file (demo mode, local database, photos in the database).
# To run against Supabase instead, see docs/supabase.md — only environment variables change.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pathwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pathwise}
      POSTGRES_DB: ${POSTGRES_DB:-pathwise}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pathwise} -d ${POSTGRES_DB:-pathwise}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pathwise:pathwise@db:5432/pathwise
      DATABASE_SSL: "false"
      JWT_SECRET: demo-jwt-secret-at-least-32-characters-for-pathwise
      DEMO_MODE: "true"
      SEED_ON_START: "true"
      DEMO_CLOCK_START: "2026-04-30T02:30:00+05:30"
      DEMO_PASSWORD: PathWise@2026
      ADMIN_EMAIL: admin@pathwise.lk
      ADMIN_PASSWORD: ""
      AUTH_PROVIDER: local
      STORAGE_PROVIDER: db
      APP_URL: http://localhost:8080
      CORS_ORIGINS: ""
      TRUST_PROXY: "false"
      LOG_LEVEL: info
    ports:
      - "8080:8080"

volumes:
  pgdata:
