# Render Blueprint (https://render.com/deploy): one Docker web service. The database is your Supabase project.
# Values marked "sync: false" are asked for when you create the Blueprint — paste them from Supabase (docs/supabase.md).
services:
  - type: web
    name: pathwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # Supabase → Connect → Session pooler (port 5432) connection string
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_MAX
        value: "8"
      - key: JWT_SECRET
        generateValue: true
      - key: AUTH_PROVIDER
        value: supabase
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: pathwise-proofs
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_URL               # e.g. https://pathwise.onrender.com (used in password-reset emails)
        sync: false
      - key: DEMO_MODE             # keep "true" for judging (demo accounts, demo clock, reset); "false" for real use
        value: "true"
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_PASSWORD
        value: PathWise@2026
      - key: TRUST_PROXY
        value: "true"
