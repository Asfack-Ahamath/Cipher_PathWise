# One-click deploy on Render (https://render.com/deploy): a Docker web service + managed PostgreSQL.
databases:
  - name: pathwise-db
    plan: free
    databaseName: pathwise
    user: pathwise

services:
  - type: web
    name: pathwise
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: pathwise-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_PASSWORD
        value: PathWise@2026
