<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1052" width="1000" height="1052" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
<title id="t">PathWise use cases</title>
<desc id="d">UML use-case diagram. Five roles and what each can do: Store manager (orders, notices, receipt), Dispatcher (plan, monitor, decide), Loader (load and release), Driver (deliver, works offline), Administrator (people, fleet, rules, data, audit, plus everything a Dispatcher can do). Every role signs in and receives live notifications.</desc>
