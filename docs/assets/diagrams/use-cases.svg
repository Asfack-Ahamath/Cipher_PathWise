<ellipse cx="295.0" cy="156.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="152.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">S1</tspan> Place, change or cancel an order</text>
<text x="295.0" y="166.0" font-size="12.5" text-anchor="middle" fill="#042F2E">before the 16:00 cutoff</text>
<ellipse cx="295.0" cy="204.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="200.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">S2</tspan> See expected arrival</text>
<text x="295.0" y="214.0" font-size="12.5" text-anchor="middle" fill="#042F2E">and deferral notices</text>
<ellipse cx="295.0" cy="252.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="248.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">S3</tspan> Confirm receipt line by line,</text>
<text x="295.0" y="262.0" font-size="12.5" text-anchor="middle" fill="#042F2E">report issues</text>
<ellipse cx="295.0" cy="300.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="304.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">S4</tspan> Review order and deferral history</text>
<ellipse cx="295.0" cy="398.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="394.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">L1</tspan> Receive the load list</text>
<text x="295.0" y="408.0" font-size="12.5" text-anchor="middle" fill="#042F2E">in reverse stop order</text>
<ellipse cx="295.0" cy="446.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="450.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">L2</tspan> Verify and tick the load</text>
<ellipse cx="295.0" cy="494.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="498.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">L3</tspan> Flag shortfall, damage or fault</text>
<ellipse cx="295.0" cy="542.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="546.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">L4</tspan> Release the vehicle to the driver</text>
<ellipse cx="295.0" cy="640.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="644.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">A1</tspan> Manage people and access</text>
<ellipse cx="295.0" cy="688.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="692.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">A2</tspan> Manage fleet, outlets, rules</text>
<ellipse cx="295.0" cy="736.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="740.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">A3</tspan> Import data (Task 2A forecast)</text>
<ellipse cx="295.0" cy="784.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="295.0" y="788.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">A4</tspan> Review audit log and health</text>
<ellipse cx="295.0" cy="832.0" rx="130.0" ry="20.0" fill="#F1F5F9" stroke="#64748B" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="295.0" y="828.5" font-size="12.5" text-anchor="middle" fill="#334155">Everything a Dispatcher can do</text>
<text x="295.0" y="842.0" font-size="12.5" text-anchor="middle" fill="#334155">(D1 to D7)</text>
<ellipse cx="685.0" cy="156.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="160.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D1</tspan> Review the confirmed queue</text>
<ellipse cx="685.0" cy="204.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="208.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D2</tspan> Auto-plan and adjust</text>
<ellipse cx="685.0" cy="252.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="248.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D3</tspan> Explain deferrals</text>
<text x="685.0" y="262.0" font-size="12.5" text-anchor="middle" fill="#042F2E">forced or chosen</text>
<ellipse cx="685.0" cy="300.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="304.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D4</tspan> Publish the plan and notify</text>
<ellipse cx="685.0" cy="348.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="352.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D5</tspan> Track trips live</text>
<ellipse cx="685.0" cy="396.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="392.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D6</tspan> Resolve exceptions,</text>
<text x="685.0" y="406.0" font-size="12.5" text-anchor="middle" fill="#042F2E">move a stop</text>
<ellipse cx="685.0" cy="444.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="440.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">D7</tspan> Forecast capacity,</text>
<text x="685.0" y="454.0" font-size="12.5" text-anchor="middle" fill="#042F2E">peak-day lab</text>
<ellipse cx="685.0" cy="492.0" rx="130.0" ry="20.0" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="685.0" y="496.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">V1</tspan> Validate against every rule</text>
<ellipse cx="685.0" cy="590.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="586.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">R1</tspan> Receive the route,</text>
<text x="685.0" y="600.0" font-size="12.5" text-anchor="middle" fill="#042F2E">start the trip</text>
<ellipse cx="685.0" cy="638.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="642.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">R2</tspan> Record delivery with proof</text>
<ellipse cx="685.0" cy="686.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="690.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">R3</tspan> Report a problem or delay</text>
<ellipse cx="685.0" cy="734.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="738.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">R4</tspan> Work offline and sync</text>
<ellipse cx="685.0" cy="782.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="786.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">R5</tspan> Close the trip</text>
<ellipse cx="685.0" cy="880.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="884.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">X1</tspan> Sign in</text>
<ellipse cx="685.0" cy="928.0" rx="130.0" ry="20.0" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.6"/>
<text x="685.0" y="932.5" font-size="12.5" text-anchor="middle" fill="#042F2E"><tspan font-weight="700" fill="#0F766E">X2</tspan> Receive live notifications</text>
